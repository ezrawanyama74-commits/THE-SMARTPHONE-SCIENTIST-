<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Smartphone Scientist</title>
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="KnK7fMRavFEkhzW_yI5F8W7LAt7twSg7p9Aj5OWXHwc" />
    
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(34, 211, 238, 0.12) 0%, transparent 40%);
        }
        .landing-card {
            width: 100%;
            min-height: 100vh;
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(14px);
            border-left: 2px solid rgba(6, 182, 212, 0.4);
            border-right: 2px solid rgba(6, 182, 212, 0.4);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 1.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-container { position: relative; margin-bottom: 16px; }
        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #06b6d4;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.6);
            animation: pulseGlow 3s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); }
            50% { box-shadow: 0 0 38px rgba(34, 211, 238, 0.9); }
        }
        h1 {
            font-size: 20pt;
            margin-bottom: 4px;
            color: #22d3ee;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 14px rgba(6, 182, 212, 0.6);
        }
        .tagline {
            font-size: 13pt;
            color: #67e8f9;
            font-style: italic;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(6, 182, 212, 0.1);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: "Times New Roman", Times, serif;
            font-size: 11pt;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #06b6d4, #22d3ee);
            color: #030712;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
        }
        .tab-content-container {
            max-width: 650px;
            width: 100%;
            min-height: 180px;
            margin: 0 auto 20px auto;
        }
        .tab-panel {
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        .tab-panel.active { display: block; }
        p {
            font-size: 12pt;
            line-height: 1.7;
            text-align: justify;
            color: #cbd5e1;
            margin-bottom: 12px;
        }
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            text-align: left;
            margin-top: 10px;
        }
        .skill-item {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 10px 14px;
            border-radius: 8px;
            color: #22d3ee;
            font-size: 11pt;
        }
        .skill-item i { margin-right: 8px; color: #67e8f9; }
        .quote-card {
            background: rgba(6, 182, 212, 0.08);
            border-left: 4px solid #22d3ee;
            padding: 20px;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }
        .quote-card blockquote {
            font-size: 13pt;
            font-style: italic;
            color: #67e8f9;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .quote-card cite { font-size: 11pt; color: #94a3b8; font-style: normal; }
        .btn-explore {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 32px;
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
            font-weight: bold;
            color: #030712;
            background: linear-gradient(135deg, #06b6d4, #22d3ee);
            border: none;
            border-radius: 30px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn-explore:hover {
            background: linear-gradient(135deg, #22d3ee, #67e8f9);
            box-shadow: 0 0 32px rgba(34, 211, 238, 0.95);
            transform: translateY(-2px);
        }
        .social-dock {
            display: flex;
            gap: 20px;
            margin-top: 24px;
            align-items: center;
            justify-content: center;
        }
        .social-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #22d3ee;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .social-icon:hover {
            background: #06b6d4;
            color: #030712;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.9);
            transform: translateY(-3px);
        }
        @media (min-width: 768px) {
            .landing-card {
                max-width: 820px;
                min-height: 85vh;
                border-radius: 16px;
                border: 1px solid rgba(6, 182, 212, 0.4);
                box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            }
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo" class="logo">
        </div>
        
        <h1 id="landing-title">Loading...</h1>
        <div class="tagline" id="landing-tagline">Loading...</div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('about')">About Me</button>
            <button class="tab-btn" onclick="switchTab('specializations')">Specializations</button>
            <button class="tab-btn" onclick="switchTab('philosophy')">Philosophy</button>
        </div>

        <div class="tab-content-container">
            <div id="tab-about" class="tab-panel active">
                <div id="about-text-container"></div>
            </div>

            <div id="tab-specializations" class="tab-panel">
                <div class="skills-grid" id="skills-grid"></div>
            </div>

            <div id="tab-philosophy" class="tab-panel">
                <div class="quote-card">
                    <blockquote id="phil-quote">Loading...</blockquote>
                    <cite id="phil-cite">— The Smartphone Scientist</cite>
                </div>
            </div>
        </div>

        <a href="explore.html" class="btn-explore">Enter to Explore</a>

        <div class="social-dock" id="social-dock">
            <a href="#" target="_blank" class="social-icon" id="social-github"><i class="fab fa-github"></i></a>
            <a href="#" target="_blank" class="social-icon" id="social-whatsapp"><i class="fab fa-whatsapp"></i></a>
            <a href="#" class="social-icon" id="social-email"><i class="fas fa-envelope"></i></a>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        async function loadLandingContent() {
            try {
                const res = await fetch('/api/projects');
                const data = await res.json();
                
                // Landing Text
                if(data.landing) {
                    document.getElementById('landing-title').textContent = data.landing.name || '';
                    document.getElementById('landing-tagline').textContent = data.landing.tagline || '';
                    
                    const aboutContainer = document.getElementById('about-text-container');
                    aboutContainer.innerHTML = '';
                    (data.landing.aboutParagraphs || []).forEach(pText => {
                        const p = document.createElement('p');
                        p.textContent = pText;
                        aboutContainer.appendChild(p);
                    });

                    const skillsGrid = document.getElementById('skills-grid');
                    skillsGrid.innerHTML = '';
                    (data.landing.specializations || []).forEach(spec => {
                        const div = document.createElement('div');
                        div.className = 'skill-item';
                        div.innerHTML = `<i class="fas fa-check-circle"></i> ${spec}`;
                        skillsGrid.appendChild(div);
                    });

                    document.getElementById('phil-quote').textContent = `"${data.landing.philosophy || ''}"`;
                    document.getElementById('phil-cite').textContent = `— ${data.landing.name || 'The Smartphone Scientist'}`;
                }

                // Social Links
                if (data.socials) {
                    if (data.socials.github) document.getElementById('social-github').href = data.socials.github;
                    if (data.socials.whatsapp) document.getElementById('social-whatsapp').href = data.socials.whatsapp;
                    if (data.socials.email) document.getElementById('social-email').href = 'mailto:' + data.socials.email;
                }
            } catch (err) {
                console.error('Could not load landing data', err);
            }
        }

        loadLandingContent();
    </script>

</body>
</html>
