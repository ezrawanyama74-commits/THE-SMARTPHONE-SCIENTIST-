<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Control - The Smartphone Scientist</title>
    <meta name="google-site-verification" content="KnK7fMRavFEkhzW_yI5F8W7LAt7twSg7p9Aj5OWXHwc" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            padding: 30px 16px;
        }
        .admin-container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(3, 7, 18, 0.95);
            border: 1px solid rgba(6, 182, 212, 0.4);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.3);
        }
        h1, h2 {
            color: #22d3ee;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h1 { font-size: 18pt; }
        h2 { font-size: 14pt; text-align: left; margin: 30px 0 15px 0; border-bottom: 1px solid rgba(6, 182, 212, 0.2); padding-bottom: 6px;}
        .form-group { margin-bottom: 16px; }
        label { display: block; color: #67e8f9; margin-bottom: 6px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(6, 182, 212, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 6px;
            color: #ffffff;
            font-family: inherit;
            font-size: 11pt;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #22d3ee;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }
        .btn-cyan {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #06b6d4, #22d3ee);
            color: #030712;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12pt;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
            transition: all 0.3s ease;
        }
        .btn-cyan:hover {
            background: linear-gradient(135deg, #22d3ee, #67e8f9);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.8);
        }
        .btn-group { display: flex; gap: 8px; }
        .hidden { display: none; }
        .project-item {
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-danger { background: #e11d48; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 16px; text-align: center; }
        .alert-error { background: rgba(225, 29, 72, 0.2); border: 1px solid #e11d48; color: #fb7185; }
        .alert-success { background: rgba(6, 182, 212, 0.2); border: 1px solid #06b6d4; color: #67e8f9; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1><i class="fas fa-user-shield"></i> Lab Control Center</h1>
        <div id="msg-box" class="alert hidden"></div>

        <!-- Auth Form -->
        <div id="login-section">
            <div class="form-group">
                <label for="admin-pass">Access Code:</label>
                <input type="password" id="admin-pass" placeholder="Enter secret admin key...">
            </div>
            <button class="btn-cyan" onclick="login()">Authenticate</button>
        </div>

        <!-- Admin Control Panel -->
        <div id="panel-section" class="hidden">
            
            <!-- Landing Page Content Section -->
            <h2><i class="fas fa-home"></i> Edit Landing Page Content</h2>
            <div class="form-group">
                <label>Main Title (Name):</label>
                <input type="text" id="landing-name">
            </div>
            <div class="form-group">
                <label>Tagline Quote:</label>
                <input type="text" id="landing-tagline">
            </div>
            <div class="form-group">
                <label>About Paragraph 1:</label>
                <textarea id="landing-p1" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>About Paragraph 2:</label>
                <textarea id="landing-p2" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Specializations (comma separated):</label>
                <input type="text" id="landing-specs">
            </div>
            <div class="form-group">
                <label>Philosophy Quote:</label>
                <input type="text" id="landing-phil">
            </div>
            <button class="btn-cyan" onclick="saveLanding()">Save Landing Content</button>

            <!-- Social Links Section -->
            <h2><i class="fas fa-share-alt"></i> Update Social Links</h2>
            <div class="form-group">
                <label><i class="fab fa-github"></i> GitHub URL:</label>
                <input type="text" id="social-github">
            </div>
            <div class="form-group">
                <label><i class="fab fa-whatsapp"></i> WhatsApp URL / Link:</label>
                <input type="text" id="social-whatsapp">
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address:</label>
                <input type="text" id="social-email">
            </div>
            <button class="btn-cyan" onclick="saveSocials()">Save Social Links</button>

            <!-- Add/Edit Projects Section -->
            <h2 id="form-heading"><i class="fas fa-code"></i> Add New Project</h2>
            <input type="hidden" id="edit-index" value="-1">
            <div class="form-group">
                <label>Project Name:</label>
                <input type="text" id="p-name" placeholder="e.g. Ezrelyn AI Proctor">
            </div>
            <div class="form-group">
                <label>Icon Class (FontAwesome):</label>
                <input type="text" id="p-icon" placeholder="e.g. fas fa-robot">
            </div>
            <div class="form-group">
                <label>Devices & Apps Used (comma separated):</label>
                <input type="text" id="p-apps" placeholder="Android Smartphone, Termux, Python">
            </div>
            <div class="form-group">
                <label>Why it was coded:</label>
                <textarea id="p-why" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>What it has solved:</label>
                <textarea id="p-solved" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Project Link:</label>
                <input type="text" id="p-link" placeholder="https://blueprints4nti.onrender.com/">
            </div>
            <button class="btn-cyan" id="save-btn" onclick="saveProject()">Save Project</button>

            <h2><i class="fas fa-list"></i> Existing Projects</h2>
            <div id="projects-list"></div>
        </div>
    </div>

    <script>
        let authToken = '';
        let globalProjects = [];

        async function login() {
            const pass = document.getElementById('admin-pass').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            const data = await res.json();
            if (data.success) {
                authToken = pass;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('panel-section').classList.remove('hidden');
                showMsg('Access granted!', 'success');
                loadData();
            } else {
                showMsg('Invalid Access Code', 'error');
            }
        }

        async function loadData() {
            const res = await fetch('/api/projects');
            const data = await res.json();
            
            if(data.landing) {
                document.getElementById('landing-name').value = data.landing.name || '';
                document.getElementById('landing-tagline').value = data.landing.tagline || '';
                document.getElementById('landing-p1').value = data.landing.aboutParagraphs?.[0] || '';
                document.getElementById('landing-p2').value = data.landing.aboutParagraphs?.[1] || '';
                document.getElementById('landing-specs').value = (data.landing.specializations || []).join(', ');
                document.getElementById('landing-phil').value = data.landing.philosophy || '';
            }

            if(data.socials) {
                document.getElementById('social-github').value = data.socials.github || '';
                document.getElementById('social-whatsapp').value = data.socials.whatsapp || '';
                document.getElementById('social-email').value = data.socials.email || '';
            }

            globalProjects = data.projects || [];
            const listDiv = document.getElementById('projects-list');
            listDiv.innerHTML = '';
            
            globalProjects.forEach((proj, idx) => {
                const item = document.createElement('div');
                item.className = 'project-item';
                item.innerHTML = `
                    <div><strong>${proj.name}</strong></div>
                    <div class="btn-group">
                        <button class="btn-edit" onclick="editProject(${idx})">Edit</button>
                        <button class="btn-danger" onclick="deleteProject(${idx})">Delete</button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        async function saveLanding() {
            const landingData = {
                name: document.getElementById('landing-name').value,
                tagline: document.getElementById('landing-tagline').value,
                aboutParagraphs: [
                    document.getElementById('landing-p1').value,
                    document.getElementById('landing-p2').value
                ],
                specializations: document.getElementById('landing-specs').value.split(',').map(s => s.trim()),
                philosophy: document.getElementById('landing-phil').value
            };

            const res = await fetch('/api/admin/landing/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': authToken },
                body: JSON.stringify(landingData)
            });
            const data = await res.json();
            if(data.success) showMsg('Landing page content updated!', 'success');
            else showMsg('Failed to update landing content', 'error');
        }

        async function saveSocials() {
            const socials = {
                github: document.getElementById('social-github').value,
                whatsapp: document.getElementById('social-whatsapp').value,
                email: document.getElementById('social-email').value
            };

            const res = await fetch('/api/admin/socials/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': authToken },
                body: JSON.stringify(socials)
            });
            const data = await res.json();
            if(data.success) showMsg('Social links updated successfully!', 'success');
            else showMsg('Failed to update socials', 'error');
        }

        async function saveProject() {
            const editIndex = parseInt(document.getElementById('edit-index').value);
            const projectData = {
                name: document.getElementById('p-name').value,
                icon: document.getElementById('p-icon').value || 'fas fa-code',
                devicesAndApps: document.getElementById('p-apps').value.split(',').map(s => s.trim()),
                why: document.getElementById('p-why').value,
                solved: document.getElementById('p-solved').value,
                link: document.getElementById('p-link').value
            };

            const endpoint = editIndex === -1 ? '/api/admin/projects/add' : '/api/admin/projects/edit';
            const payload = editIndex === -1 ? projectData : { index: editIndex, updatedProject: projectData };

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': authToken },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if(data.success) {
                showMsg(editIndex === -1 ? 'Project added successfully!' : 'Project updated successfully!', 'success');
                loadData();
                clearInputs();
            } else {
                showMsg('Operation failed', 'error');
            }
        }

        function editProject(index) {
            const proj = globalProjects[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('p-name').value = proj.name;
            document.getElementById('p-icon').value = proj.icon;
            document.getElementById('p-apps').value = proj.devicesAndApps.join(', ');
            document.getElementById('p-why').value = proj.why;
            document.getElementById('p-solved').value = proj.solved;
            document.getElementById('p-link').value = proj.link;

            document.getElementById('form-heading').innerHTML = '<i class="fas fa-edit"></i> Edit Project';
            document.getElementById('save-btn').textContent = 'Update Project';
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        async function deleteProject(index) {
            const res = await fetch('/api/admin/projects/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': authToken },
                body: JSON.stringify({ index })
            });
            const data = await res.json();
            if(data.success) {
                showMsg('Project deleted!', 'success');
                loadData();
            }
        }

        function clearInputs() {
            document.getElementById('edit-index').value = '-1';
            document.getElementById('p-name').value = '';
            document.getElementById('p-icon').value = '';
            document.getElementById('p-apps').value = '';
            document.getElementById('p-why').value = '';
            document.getElementById('p-solved').value = '';
            document.getElementById('p-link').value = '';
            document.getElementById('form-heading').innerHTML = '<i class="fas fa-code"></i> Add New Project';
            document.getElementById('save-btn').textContent = 'Save Project';
        }

        function showMsg(msg, type) {
            const box = document.getElementById('msg-box');
            box.textContent = msg;
            box.className = 'alert alert-' + type;
            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
